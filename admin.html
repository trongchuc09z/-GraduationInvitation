<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lễ Tốt Nghiệp Huyền Linh</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f1035;
            --bg-card: rgba(15, 16, 53, 0.85);
            --gold-primary: #d4af37;
            --gold-light: #f0d27f;
            --gold-dark: #b8941f;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f0d27f 50%, #d4af37 100%);
            --champagne: #f5e6cc;
            --text-primary: #f5e6cc;
            --text-secondary: rgba(245, 230, 204, 0.7);
            --text-muted: rgba(245, 230, 204, 0.5);
            --border-gold: rgba(212, 175, 55, 0.3);
            --success: #4ade80;
            --danger: #f87171;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* --- Auth Screen --- */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-screen.hidden { display: none; }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-card .auth-icon { font-size: 3rem; margin-bottom: 20px; }

        .auth-card h2 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--champagne);
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .auth-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 10px;
            color: var(--bg-primary);
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }

        .auth-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        .auth-error.visible { display: block; }

        /* --- Dashboard --- */
        .dashboard { display: none; }
        .dashboard.visible { display: block; }

        .dashboard-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-gold);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dashboard-header h1 {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--champagne);
        }

        .dashboard-header h1 span {
            color: var(--gold-primary);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .refresh-btn, .logout-btn, .back-btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-gold);
            background: transparent;
            color: var(--text-secondary);
        }

        .refresh-btn:hover, .back-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.1);
        }

        .logout-btn {
            border-color: rgba(248, 113, 113, 0.3);
            color: var(--danger);
        }

        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.1);
            border-color: var(--danger);
        }

        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 25px 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-icon { font-size: 2rem; margin-bottom: 10px; }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 0;
        }

        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--gold-primary);
            border-bottom-color: var(--gold-primary);
        }

        .tab-btn:hover {
            color: var(--gold-light);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Table */
        .data-table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: rgba(212, 175, 55, 0.1);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--gold-light);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-gold);
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            color: var(--text-secondary);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-yes {
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .badge-no {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        /* Wishes */
        .wishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .wish-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .wish-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .wish-card .wish-text {
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.6;
            position: relative;
            padding-left: 20px;
        }

        .wish-card .wish-text::before {
            content: '\201C';
            position: absolute;
            left: 0;
            top: -5px;
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--gold-primary);
            opacity: 0.5;
        }

        .wish-card .wish-author {
            font-weight: 600;
            color: var(--gold-light);
            font-size: 0.9rem;
        }

        .wish-card .wish-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 15px; }

        /* Delete button */
        .delete-btn {
            padding: 5px 12px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 6px;
            color: var(--danger);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        /* Export button */
        .export-btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.1);
            color: var(--success);
        }

        .export-btn:hover {
            background: rgba(74, 222, 128, 0.2);
            border-color: var(--success);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-header {
                padding: 15px 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .wishes-grid {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 35px 25px;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
                white-space: nowrap;
            }
        }

        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <div class="auth-icon">🔐</div>
            <h2>Admin Dashboard</h2>
            <p>Nhập mật khẩu để truy cập bảng điều khiển</p>
            <input type="password" class="auth-input" id="authPassword" placeholder="Mật khẩu..." autofocus>
            <button class="auth-btn" id="authBtn">Đăng Nhập</button>
            <p class="auth-error" id="authError">❌ Mật khẩu không chính xác!</p>
            <div style="margin-top: 20px;">
                <a href="index.html" class="back-btn" style="text-decoration:none; display:inline-block; padding: 8px 18px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.3); color: rgba(245,230,204,0.7); font-size: 0.85rem; transition: all 0.3s ease;">← Về trang thiệp</a>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <header class="dashboard-header">
            <h1>📊 Dashboard — <span>Lễ Tốt Nghiệp Huyền Linh</span></h1>
            <div class="header-actions">
                <button class="export-btn" id="exportBtn">📥 Xuất CSV</button>
                <button class="refresh-btn" id="refreshBtn">🔄 Làm mới</button>
                <a href="index.html" class="back-btn" style="text-decoration:none;">← Trang thiệp</a>
                <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
            </div>
        </header>

        <div class="dashboard-content">
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div class="stat-number" id="totalResponses">0</div>
                    <div class="stat-label">Tổng phản hồi</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-number" id="totalAttending">0</div>
                    <div class="stat-label">Sẽ tham dự</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="totalGuests">0</div>
                    <div class="stat-label">Tổng số người</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">❌</div>
                    <div class="stat-number" id="totalDeclined">0</div>
                    <div class="stat-label">Không đến</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="guests">👤 Danh sách khách</button>
                <button class="tab-btn" data-tab="wishes">💌 Lời chúc</button>
            </div>

            <!-- Guest List Tab -->
            <div class="tab-content active" id="tab-guests">
                <div class="loading-state" id="guestsLoading">
                    <div class="loading-spinner"></div>
                    <p>Đang tải dữ liệu...</p>
                </div>
                <div id="guestsContent" style="display:none;"></div>
            </div>

            <!-- Wishes Tab -->
            <div class="tab-content" id="tab-wishes">
                <div class="loading-state" id="wishesLoading">
                    <div class="loading-spinner"></div>
                    <p>Đang tải lời chúc...</p>
                </div>
                <div id="wishesContent" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
    /* ============================================
       ADMIN DASHBOARD - SCRIPT
       ============================================ */

    // ===== FIREBASE CONFIG (CHỪA TRỐNG ĐỂ BẠN TỰ ĐIỀN) =====
    const firebaseConfig = {
        apiKey: "AIzaSyB5bpeGx1AV7ZPwJkoOAPBWsFhCNtsF1yU",
        authDomain: "graduationinvitation-194ee.firebaseapp.com",
        projectId: "graduationinvitation-194ee",
        storageBucket: "graduationinvitation-194ee.firebasestorage.app",
        messagingSenderId: "467155750733",
        appId: "1:467155750733:web:e44990f4a4a0652e693104",
        measurementId: "G-H42K0P2T9C"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ===== MẬT KHẨU ADMIN (thay đổi theo ý bạn) =====
    const ADMIN_PASSWORD = "admin2026";

    // ===== GLOBAL DATA =====
    let allResponses = [];

    // ===== DOM ELEMENTS =====
    const authScreen = document.getElementById('authScreen');
    const dashboard = document.getElementById('dashboard');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const authError = document.getElementById('authError');
    const refreshBtn = document.getElementById('refreshBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const exportBtn = document.getElementById('exportBtn');

    // ===== AUTH =====
    function checkAuth() {
        const isAuth = sessionStorage.getItem('adminAuth');
        if (isAuth === 'true') {
            showDashboard();
        }
    }

    function login() {
        const password = authPassword.value.trim();
        if (password === ADMIN_PASSWORD) {
            sessionStorage.setItem('adminAuth', 'true');
            showDashboard();
        } else {
            authError.classList.add('visible');
            authPassword.value = '';
            authPassword.focus();
            setTimeout(() => authError.classList.remove('visible'), 3000);
        }
    }

    function showDashboard() {
        authScreen.classList.add('hidden');
        dashboard.classList.add('visible');
        loadData();
    }

    function logout() {
        sessionStorage.removeItem('adminAuth');
        authScreen.classList.remove('hidden');
        dashboard.classList.remove('visible');
        authPassword.value = '';
    }

    // Event listeners for auth
    authBtn.addEventListener('click', login);
    authPassword.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
    logoutBtn.addEventListener('click', logout);
    refreshBtn.addEventListener('click', loadData);

    // ===== TABS =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ===== EXPORT CSV =====
    exportBtn.addEventListener('click', () => {
        if (allResponses.length === 0) {
            alert('Không có dữ liệu để xuất.');
            return;
        }

        const headers = ['STT', 'Họ và Tên', 'Tham dự', 'Người đi cùng', 'Lời chúc', 'Thời gian'];
        const csvContent = [
            headers.join(','),
            ...allResponses.map((r, i) => {
                const date = r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleString('vi-VN') : 'N/A';
                return [
                    i + 1,
                    `"${(r.name || '').replace(/"/g, '""')}"`,
                    r.attendance === 'yes' ? 'Có' : 'Không',
                    r.guestCount || 0,
                    `"${(r.wishes || '').replace(/"/g, '""')}"`,
                    `"${date}"`
                ].join(',');
            })
        ].join('\n');

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `rsvp_graduation_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    });

    // ===== LOAD DATA =====
    async function loadData() {
        try {
            const snapshot = await db.collection('rsvp').orderBy('timestamp', 'desc').get();
            allResponses = [];

            snapshot.forEach(doc => {
                allResponses.push({ id: doc.id, ...doc.data() });
            });

            updateStats(allResponses);
            renderGuestList(allResponses);
            renderWishes(allResponses);
        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('guestsLoading').innerHTML = '<p style="color: #f87171;">❌ Lỗi tải dữ liệu. Vui lòng kiểm tra cấu hình Firebase.</p>';
            document.getElementById('wishesLoading').innerHTML = '<p style="color: #f87171;">❌ Lỗi tải dữ liệu.</p>';
        }
    }

    // ===== UPDATE STATS =====
    function updateStats(responses) {
        const attending = responses.filter(r => r.attendance === 'yes');
        const declined = responses.filter(r => r.attendance === 'no');
        const totalGuests = attending.reduce((sum, r) => sum + 1 + (parseInt(r.guestCount) || 0), 0);

        animateNumber('totalResponses', responses.length);
        animateNumber('totalAttending', attending.length);
        animateNumber('totalGuests', totalGuests);
        animateNumber('totalDeclined', declined.length);
    }

    function animateNumber(elementId, target) {
        const el = document.getElementById(elementId);
        const duration = 800;
        const start = parseInt(el.textContent) || 0;
        const startTime = performance.now();

        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.round(start + (target - start) * eased);
            if (progress < 1) requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    }

    // ===== RENDER GUEST LIST =====
    function renderGuestList(responses) {
        const loading = document.getElementById('guestsLoading');
        const content = document.getElementById('guestsContent');
        loading.style.display = 'none';
        content.style.display = 'block';

        if (responses.length === 0) {
            content.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>Chưa có phản hồi nào</p>
                </div>
            `;
            return;
        }

        let tableHTML = `
            <div class="data-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Họ và Tên</th>
                            <th>Tham dự</th>
                            <th>Người đi cùng</th>
                            <th>Lời chúc</th>
                            <th>Thời gian</th>
                            <th>Xóa</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        responses.forEach((r, index) => {
            const date = r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleString('vi-VN') : 'N/A';
            const attendBadge = r.attendance === 'yes'
                ? '<span class="badge badge-yes">✅ Có</span>'
                : '<span class="badge badge-no">❌ Không</span>';
            const wishPreview = r.wishes ? (r.wishes.length > 50 ? r.wishes.substring(0, 50) + '...' : r.wishes) : '—';

            tableHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-weight:600; color:var(--champagne);">${escapeHTML(r.name)}</td>
                    <td>${attendBadge}</td>
                    <td style="text-align:center;">${r.guestCount || 0}</td>
                    <td>${escapeHTML(wishPreview)}</td>
                    <td style="font-size:0.8rem; color:var(--text-muted); white-space:nowrap;">${date}</td>
                    <td><button class="delete-btn" onclick="deleteResponse('${r.id}')">🗑️</button></td>
                </tr>
            `;
        });

        tableHTML += '</tbody></table></div>';
        content.innerHTML = tableHTML;
    }

    // ===== RENDER WISHES =====
    function renderWishes(responses) {
        const loading = document.getElementById('wishesLoading');
        const content = document.getElementById('wishesContent');
        loading.style.display = 'none';
        content.style.display = 'block';

        const withWishes = responses.filter(r => r.wishes && r.wishes.trim() !== '');

        if (withWishes.length === 0) {
            content.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <p>Chưa có lời chúc nào</p>
                </div>
            `;
            return;
        }

        let html = '<div class="wishes-grid">';
        withWishes.forEach(r => {
            const date = r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleDateString('vi-VN') : '';
            html += `
                <div class="wish-card">
                    <p class="wish-text">${escapeHTML(r.wishes)}</p>
                    <p class="wish-author">— ${escapeHTML(r.name)}</p>
                    <p class="wish-date">${date}</p>
                </div>
            `;
        });
        html += '</div>';
        content.innerHTML = html;
    }

    // ===== DELETE RESPONSE =====
    async function deleteResponse(id) {
        if (!confirm('Bạn có chắc muốn xóa phản hồi này?')) return;
        try {
            await db.collection('rsvp').doc(id).delete();
            loadData();
        } catch (error) {
            console.error('Error deleting:', error);
            alert('Lỗi khi xóa. Vui lòng thử lại.');
        }
    }

    // ===== UTILITY =====
    function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ===== INIT =====
    checkAuth();
    </script>
</body>
</html>
